#
# Build OpenWrt firmware for Orange Pi Zero 3 (Allwinner H618, 1GB)
# Base: ImmortalWrt openwrt-24.10 (Linux 6.6 LTS)
# Role: low-memory proxy / "science" router (OpenClash + PassWall + SSR+)
#
# The old master build (Linux 6.18) hit a __slab_free panic in S19firewall.
# Staying on the 24.10 stable branch gives us the 6.6 LTS kernel and a
# firewall4/nftables userland that is actually tested with this target.
#

name: Build OpenWrt Zero 3

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: orange-pi-zero3.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  EXTRA_IMAGE_NAME: OPi-Mini-OpenClash
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Lint custom scripts
      run: |
        bash -n "$DIY_P1_SH" "$DIY_P2_SH"
        for f in files/etc/uci-defaults/*; do
          bash -n "$f"
        done
        python3 - <<'PY'
        import glob, re, sys
        bad = []
        for f in glob.glob('files/etc/uci-defaults/*'):
            for i, line in enumerate(open(f, encoding='utf-8'), 1):
                # uci set "key='VALUE'" stores the single quotes as part of the
                # value; fw4 then treats e.g. zone.input as invalid.
                if re.search(r'uci\s+set\s+"[^"]*=\'', line):
                    bad.append(f'{f}:{i}: {line.strip()}')
        if bad:
            print('FAIL: single quotes inside a double-quoted uci set value')
            print('\n'.join(bad))
            sys.exit(1)
        print('OK: custom scripts linted')
        PY


    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker system prune -a -f
        df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
          haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip \
          p7zip-full patch pkgconf python3 python3-pyelftools \
          python3-setuptools qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code (Shallow Clone)
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 --filter=blob:none "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Verify source branch and kernel
      run: |
        cd openwrt
        branch="$(git branch --show-current)"
        echo "source branch: ${branch:-<detached>}"
        [ "$branch" = "$REPO_BRANCH" ] || { echo "FAIL: expected $REPO_BRANCH, got ${branch:-<detached>}"; exit 1; }
        [ -f include/kernel-6.6 ] || { echo "FAIL: include/kernel-6.6 missing (not a 6.6 tree)"; exit 1; }
        grep -q '^LINUX_VERSION-6.6' include/kernel-6.6 || { echo "FAIL: 6.6 kernel version marker missing"; exit 1; }
        echo "OK: ImmortalWrt openwrt-24.10 / Linux 6.6 LTS"

    - name: Load custom feeds
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Validate feeds.conf.default
      run: |
        cd openwrt
        # scripts/feeds strips comments with s/#.+$//, so a bare "#" line is
        # NOT stripped and is parsed as a feed entry -> "Syntax error".
        if grep -n '^#$' feeds.conf.default; then
          echo "FAIL: bare '#' comment line in feeds.conf.default"
          exit 1
        fi
        ./scripts/feeds list -n
        echo "OK: feeds.conf.default parsed"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc) || make download -j8 V=s
        find dl -size -1024c -delete

    - name: Verify iStore / quickstart dependency guard
      run: |
        cd openwrt
        echo "--- tar / xz-utils definitions ---"
        grep -nE "^[[:space:]]*config PACKAGE_(TAR_XZ|tar|xz-utils)[[:space:]]*$" tmp/.config-package.in | head -5 || echo "no definitions"
        echo "--- .config state ---"
        grep -E "^CONFIG_PACKAGE_(luci-app-store|luci-app-quickstart|quickstart|xz-utils)=" .config || echo "MISSING FROM .config"
        grep -q "^CONFIG_PACKAGE_luci-app-store=y" .config
        grep -q "^CONFIG_PACKAGE_luci-app-quickstart=y" .config
        grep -q "^CONFIG_PACKAGE_xz-utils=y" .config
        echo "OK: iStore + quickstart + xz-utils selected"

    - name: Verify key packages in .config
      run: |
        cd openwrt
        fail=0
        required="
          luci-app-openclash openclash-core
          luci-app-store luci-app-quickstart luci-app-ttyd luci-app-upnp
          luci-i18n-base-zh-cn htop iperf3 zram-swap
          kmod-uwe5622 uwe5622-firmware
          luci-compat luci-lua-runtime
        "
        for p in $required; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "OK: $p enabled"
          elif grep -q "^# CONFIG_PACKAGE_$p is not set" .config; then
            echo "FAIL: $p exists but was dropped by defconfig (unmet dependency):"
            grep -A30 "^config PACKAGE_$p\$" tmp/.config-package.in | head -35 || true
            fail=1
          else
            echo "FAIL: $p not found in package metadata (feed not installed?)"
            fail=1
          fi
        done
        grep -q "^CONFIG_LUCI_LANG_zh_Hans=y" .config || { echo "FAIL: LuCI zh_Hans disabled"; fail=1; }
        grep -q "^CONFIG_TARGET_sunxi_cortexa53_DEVICE_xunlong_orangepi-zero3=y" .config || { echo "FAIL: Zero 3 target lost"; fail=1; }
        grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=2048" .config || { echo "FAIL: rootfs size changed"; fail=1; }
        [ "$fail" -eq 0 ] || exit 1
        echo "OK: all required OpenClash/target packages present"

    - name: Verify removed packages are gone
      run: |
        cd openwrt
        fail=0
        # heavy services
        for p in docker dockerd containerd runc luci-app-dockerman \
                 samba4-server luci-app-samba4 \
                 aria2 luci-app-aria2 ariang \
                 luci-app-unblockneteasemusic; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "FAIL: $p must not be selected"
            fail=1
          fi
        done
        # proxy stack other than OpenClash
        for p in luci-app-passwall luci-app-passwall2 luci-app-ssr-plus \
                 xray-core sing-box chinadns-ng dns2socks dns2tcp microsocks \
                 ipt2socks v2ray-geoip v2ray-geosite shadowsocks-rust-sslocal \
                 haproxy tcping geoview; do
          if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
            echo "FAIL: $p must not be selected (OpenClash-only image)"
            fail=1
          fi
        done
        [ "$fail" -eq 0 ] && echo "OK: no Docker/Samba/aria2/extra proxy stack selected"
        exit "$fail"

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "Using $(($(nproc) - 1)) cores for compilation"
        make -j$(($(nproc) - 1)) EXTRA_IMAGE_NAME="$EXTRA_IMAGE_NAME" || \
          make -j2 EXTRA_IMAGE_NAME="$EXTRA_IMAGE_NAME" || \
          make -j1 V=s EXTRA_IMAGE_NAME="$EXTRA_IMAGE_NAME"
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Verify runtime files in rootfs
      run: |
        cd openwrt
        rootfs="$(ls -d staging_dir/target-*/root-* 2>/dev/null | head -1)"
        [ -n "$rootfs" ] || { echo "FAIL: target rootfs not found"; exit 1; }
        for f in usr/lib/lua/luci/cbi/datatypes.lua \
                 usr/lib/lua/luci/model/uci.lua \
                 etc/openclash/core/clash_meta; do
          if [ -f "$rootfs/$f" ]; then
            echo "OK: $f"
          else
            echo "FAIL: missing $f in $rootfs"
            exit 1
          fi
        done

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OPi-Mini_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "--- built images ---"
        ls -lh *.img.gz *.bin 2>/dev/null || true
        if ls *opi-mini* >/dev/null 2>&1; then
          echo "OK: firmware name contains opi-mini"
        else
          echo "FAIL: image name does not contain opi-mini (EXTRA_IMAGE_NAME not applied)"
          ls -1
          exit 1
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OPi-Mini_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: error

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
        touch release.txt
        echo "- Orange Pi Zero 3 (H618) / ImmortalWrt openwrt-24.10 (Linux 6.6 LTS)" >> release.txt
        echo "- 路由模式固件：eth0 = WAN，Wi-Fi = LAN 192.168.44.1，LAN DHCP 开启" >> release.txt
        echo "- Wi-Fi: SSID OPi-Mini / 密码 aa88888888（2.4GHz WPA2）" >> release.txt
        echo "- 已内置 OpenClash Meta 内核（/etc/openclash/core/clash_meta），开箱可用" >> release.txt
        echo "- 已移除 PassWall / PassWall2 / SSR+ / xray / sing-box 等额外代理栈" >> release.txt
        echo "- 1GB 适配：OpenClash 实测 CPU < 30%，zram-swap 已启用" >> release.txt
        echo "- 已移除 Docker / Samba / aria2 / adbyby / 网易云解锁" >> release.txt
        echo "- 板载 AW859A (UWE5622) Wi-Fi 驱动 + 固件（24.10/6.6 backport）" >> release.txt
        echo "- 若 1GB 版无法启动：接串口 115200 看 DRAM 那一行，排查表见 README" >> release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Post-cleanup
      run: |
        sudo rm -rf /workdir/openwrt/dl
        df -h
